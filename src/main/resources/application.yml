server:
  port: 8080

spring:
  application:
    name: polizas-api
  datasource:
    url: jdbc:h2:mem:polizasdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

api:
  key: 123456
  ipc: 0.05

logging:
  level:
    com.segurosbolivar: INFO